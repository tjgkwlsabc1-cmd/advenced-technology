name: Build Mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build-tools
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3"
          echo "$ANDROID_HOME/build-tools/30.0.3" >> "$GITHUB_PATH"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build mod (desktop + Android)
        run: ./gradlew deploy --no-daemon

      - name: Stop any lingering Gradle daemons
        if: always()
        run: ./gradlew --stop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: build/libs/${{ github.event.repository.name }}.jar

      # 아래 단계는 태그(v1.0 등)를 push했을 때만 실행되어,
      # GitHub Release를 자동으로 만들고 jar를 첨부합니다.
      - name: Create/Update GitHub Release with jar
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/${{ github.event.repository.name }}.jar
