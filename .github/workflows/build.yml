name: Build and Release Mindustry Jar Mod

on:
  workflow_dispatch:

  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew jar

      - name: Locate mod JAR
        run: |
          set -e
          mkdir -p release
          jar_path=$(find . -type f -name "*.jar" ! -path "./gradle/wrapper/*" ! -path "./release/*" | head -n 1)
          test -n "$jar_path"
          echo "Using JAR: $jar_path"
          cp "$jar_path" release/
          ls -lah release

      - name: Upload JAR to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
