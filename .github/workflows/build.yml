name: Mindustry Java Mod Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub 저장소에서 코드 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 서버에 Java 환경 세팅
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. 리눅스 환경에서 Gradle 실행이 가능하도록 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 하드코딩된 java.home 속성을 무시하고 빌드 실행
    - name: Build with Gradle
      run: ./gradlew jar -Dorg.gradle.java.home=$JAVA_HOME
