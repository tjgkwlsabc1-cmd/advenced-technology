name: Mindustry Java Mod Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub 저장소에서 코드 가져오기
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 빌드에 필요한 Java 17 환경 설정 (Mindustry 최신 버전 표준)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. Gradle 실행 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 모드 빌드 실행 (PC용 jar 및 안드로이드용 dex 통합 빌드)
    - name: Build with Gradle
      run: ./gradlew jar

    # 5. 빌드가 완료된 .jar 파일을 GitHub Actions 결과물로 업로드
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mindustry-Mod-Jar
        path: build/libs/*.jar
